. $(dirname $3)/conf_framework.sh

check() {
	cur_name=$(basename $2)
	config_file_path=$1
	if compile_module $cur_name "int x = WQ_PERCPU;" "linux/workqueue.h"
	then
		echo $cur_name "1" >> $config_file_path
	else
		echo $cur_name "2" >> $config_file_path
	fi
}

apply() {
    case "$1" in
    "1")
		add_define "CAS_WQ_PERCPU (WQ_PERCPU)" ;;
    "2")
		add_define "CAS_WQ_PERCPU (0)" ;;
    *)
        exit 1
    esac
}

conf_run $@
