. $(dirname $3)/conf_framework.sh

# sysfs_emit() was introduced in v5.10.
check() {
	cur_name=$(basename $2)
	config_file_path=$1
	if compile_module $cur_name "sysfs_emit(NULL, \"\");" "linux/sysfs.h"
	then
		echo $cur_name "1" >> $config_file_path
	else
		echo $cur_name "2" >> $config_file_path
	fi
}

apply() {
    case "$1" in
    "1")
		add_define "cas_sysfs_emit(buf, fmt, ...) \\
			sysfs_emit(buf, fmt, ##__VA_ARGS__)" ;;
    "2")
		add_define "cas_sysfs_emit(buf, fmt, ...) \\
			scnprintf(buf, PAGE_SIZE, fmt, ##__VA_ARGS__)" ;;
    *)
        exit 1
    esac
}

conf_run $@
