. $(dirname $3)/conf_framework.sh

# ida_alloc_max()/ida_free() were introduced in v4.19; older kernels only
# have ida_simple_get()/ida_simple_remove(), which were removed in v6.9.
check() {
	cur_name=$(basename $2)
	config_file_path=$1
	if compile_module $cur_name "ida_alloc_max(NULL, 0, GFP_KERNEL);" "linux/idr.h"
	then
		echo $cur_name "1" >> $config_file_path
	elif compile_module $cur_name "ida_simple_get(NULL, 0, 0, GFP_KERNEL);" "linux/idr.h"
	then
		echo $cur_name "2" >> $config_file_path
	else
		echo $cur_name "X" >> $config_file_path
	fi
}

apply() {
    case "$1" in
    "1")
		add_function "
	static inline int cas_ida_alloc_max(struct ida *ida, unsigned int max,
			gfp_t gfp)
	{
		return ida_alloc_max(ida, max, gfp);
	}"
		add_function "
	static inline void cas_ida_free(struct ida *ida, unsigned int id)
	{
		ida_free(ida, id);
	}" ;;
    "2")
		add_function "
	static inline int cas_ida_alloc_max(struct ida *ida, unsigned int max,
			gfp_t gfp)
	{
		return ida_simple_get(ida, 0, max + 1, gfp);
	}"
		add_function "
	static inline void cas_ida_free(struct ida *ida, unsigned int id)
	{
		ida_simple_remove(ida, id);
	}" ;;
    *)
        exit 1
    esac
}

conf_run $@
